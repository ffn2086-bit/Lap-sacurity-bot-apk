name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install required SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: gradle clean assembleDebug --stacktrace --no-daemon --no-build-cache --rerun-tasks 2>&1 | tee build-error.log

      - name: List produced outputs
        if: always()
        run: |
          echo "=== find app/build/outputs ===" > outputs-find.log
          find app/build/outputs -type f >> outputs-find.log 2>&1 || echo "no outputs dir" >> outputs-find.log
          echo "=== find app/build for apk anywhere ===" >> outputs-find.log
          find app/build -iname "*.apk" >> outputs-find.log 2>&1 || true
          cat outputs-find.log

      - name: Always save diagnostic logs to repo
        if: always()
        run: |
          tail -n 400 build-error.log > build-error-tail.log 2>/dev/null || echo "no build-error.log" > build-error-tail.log
          git config user.email "bot@users.noreply.github.com"
          git config user.name "build-bot"
          git add -f build-error-tail.log outputs-find.log
          git commit -m "Diagnostic logs [skip ci]" || true
          git push || true

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SentinelLaptopGuard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
